          <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 26, fontWeight: 600, overflowWrap: "anywhere", lineHeight: 1.1, color: sw.fg, marginTop: "auto" }}>
            {l1}<br/>{l2}
          </div>
        </div>
      );
    }

    function ImagePicker({ value, onChange, idSuffix, label = "Product image", maxDim = 640, preview }) {
      return (
        <div>
          <label className="at-label">{label}</label>
          {value && (
            preview ? (
              <div style={{ marginBottom: 10 }}>{preview(value)}</div>
            ) : (
              <div style={{ width: 100, height: 100, borderRadius: 2, overflow: "hidden", marginBottom: 10, background: "var(--paper)" }}>
                <ProductImage product={{ image: value, name: "" }} />
              </div>
            )
          )}
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <button type="button" onClick={() => document.getElementById("img-upload-" + idSuffix).click()} className="at-btn at-btn-ghost at-btn-sm">
              Upload from device
            </button>
            <input id={"img-upload-" + idSuffix} type="file" accept="image/*" style={{ display: "none" }}
              onChange={e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                  const img = new Image();
                  img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                      const scale = maxDim / Math.max(width, height);
                      width = Math.round(width * scale);
                      height = Math.round(height * scale);
                    }
                    const canvas = document.createElement("canvas");
                    canvas.width = width; canvas.height = height;
                    canvas.getContext("2d").drawImage(img, 0, 0, width, height);
                    onChange(canvas.toDataURL("image/jpeg", 0.72));
                  };
                  img.src = reader.result;
                };
                reader.readAsDataURL(file);
              }} />
            {value && (
              <button type="button" onClick={() => onChange("")} className="at-btn at-btn-ghost at-btn-sm">
                Remove image
              </button>
            )}
          </div>
          <input className="at-field" style={{ marginTop: 8 }} value={value || ""} onChange={e => onChange(e.target.value)} placeholder="or paste an image URL (cloud link)" />
        </div>
      );
    }

    function App() {
      const [ready, setReady] = useState(false);
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [staff, setStaff] = useState([]);
      const [customerProfile, setCustomerProfile] = useState(null);
      const [staffProfile, setStaffProfile] = useState(null);
      const [myOrders, setMyOrders] = useState([]);
      const [myOrdersError, setMyOrdersError] = useState(null);
      const [mode, setMode] = useState(() => (window.location.hash.startsWith("#admin") ? "admin" : "store"));
      const [cart, setCart] = useState([]);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        let productsLoaded = false, settingsLoaded = false;
        const maybeReady = () => { if (productsLoaded && settingsLoaded) setReady(true); };
        const unsubProducts = db.collection("products").onSnapshot(snap => {
          setProducts(snap.docs.map(d => d.data()));
          productsLoaded = true; maybeReady();
        });
        const unsubOrders = db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snap => {
          setOrders(snap.docs.map(d => d.data()));
        });
        const unsubSettings = db.collection("settings").doc("main").onSnapshot(doc => {
          setSettings(doc.exists ? { ...DEFAULT_SETTINGS, ...doc.data() } : DEFAULT_SETTINGS);
          settingsLoaded = true; maybeReady();
        });
        const unsubStaff = db.collection("staff").onSnapshot(snap => {
          setStaff(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
        return () => { unsubProducts(); unsubOrders(); unsubSettings(); unsubStaff(); };
      }, []);

      useEffect(() => {
        let unsubCustomer = null, unsubStaff = null;
        const unsubAuth = auth.onAuthStateChanged((user) => {
          if (unsubCustomer) { unsubCustomer(); unsubCustomer = null; }
          if (unsubStaff) { unsubStaff(); unsubStaff = null; }
          if (!user) { setCustomerProfile(null); setStaffProfile(null); return; }
          unsubCustomer = db.collection("customers").doc(user.uid).onSnapshot(
            snap => setCustomerProfile(snap.exists ? { id: user.uid, ...snap.data() } : null),
            e => console.error("Failed to load customer profile", e)
          );
          unsubStaff = db.collection("staff").doc(user.uid).onSnapshot(
            snap => setStaffProfile(snap.exists ? { id: user.uid, ...snap.data() } : null),
            e => console.error("Failed to load staff profile", e)
          );
        });
        return () => { unsubAuth(); if (unsubCustomer) unsubCustomer(); if (unsubStaff) unsubStaff(); };
      }, []);

      useEffect(() => {
        if (!customerProfile) { setMyOrders([]); setMyOrdersError(null); return; }
        setMyOrdersError(null);
        const unsub = db.collection("orders").where("customerId", "==", customerProfile.id).onSnapshot(
          snap => setMyOrders(snap.docs.map(d => d.data()).sort((a, b) => b.createdAt - a.createdAt)),
          e => { console.error("Failed to load your orders", e); setMyOrdersError(e.message); }
        );
        return unsub;
      }, [customerProfile]);

      const notify = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); }, []);

      const updateCustomerProfile = useCallback(async (updates) => {
        try {
          await db.collection("customers").doc(auth.currentUser.uid).update(updates);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: e.message };
        }
      }, []);

      const money = useMoney(settings);

      const signUp = useCallback(async ({ name, email, phone, location, password }) => {
        try {
          const cred = await auth.createUserWithEmailAndPassword(email.trim(), password);
          await db.collection("customers").doc(cred.user.uid).set({
            name: name.trim(), email: email.trim(), phone: phone.trim(), location, createdAt: Date.now(),
          });
          return { ok: true };
        } catch (e) {
          return { ok: false, error: e.code === "auth/email-already-in-use" ? "An account with this email already exists. Try signing in instead." : e.message };
        }
      }, []);

      const signIn = useCallback(async ({ email, password }) => {
        try {
          await auth.signInWithEmailAndPassword(email.trim(), password);
          return { ok: true };
        } catch (e) {
          return { ok: false, error: `That email/password doesn't match. (${e.code})` };
        }
      }, []);

      const signOut = useCallback(() => auth.signOut(), []);

      const placeOrder = useCallback(async (orderData) => {
        const counterRef = db.collection("meta").doc("orderCounter");
        const orderId = await db.runTransaction(async (tx) => {
          const snap = await tx.get(counterRef);
          const next = (snap.exists ? snap.data().value : 1000) + 1;
          tx.set(counterRef, { value: next });
          const id = "ORD-" + next;
          tx.set(db.collection("orders").doc(id), { ...orderData, id });
          return id;
        });
        const batch = db.batch();
        orderData.items.forEach(it => {
          batch.update(db.collection("products").doc(it.id), { stock: firebase.firestore.FieldValue.increment(-it.qty) });
        });
        await batch.commit();
        return orderId;
      }, []);

      const resetAll = useCallback(async () => {
        const [prodSnap, orderSnap] = await Promise.all([db.collection("products").get(), db.collection("orders").get()]);
        const delBatch = db.batch();
        prodSnap.forEach(d => delBatch.delete(d.ref));
        orderSnap.forEach(d => delBatch.delete(d.ref));
        await delBatch.commit();
        const p = seedProducts(); const o = seedOrders(p);
        const addBatch = db.batch();
        p.forEach(item => addBatch.set(db.collection("products").doc(item.id), item));
        o.forEach(item => addBatch.set(db.collection("orders").doc(item.id), item));
        addBatch.set(db.collection("settings").doc("main"), DEFAULT_SETTINGS);
        await addBatch.commit();
        notify("Store reset to sample data");
      }, [notify]);

      if (!ready) {
        return (
          <div className="at-root" style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh" }}>
            <style>{STYLES}</style>
            <div style={{ textAlign: "center" }}>
              <img src={DEFAULT_SETTINGS.logo} alt="" style={{ width: 96, height: 96, borderRadius: "50%", objectFit: "cover", boxShadow: "0 0 0 1px var(--line-strong)" }} />
              <div style={{ fontSize: 11, letterSpacing: ".3em", textTransform: "uppercase", color: "var(--gold)", marginTop: 18 }}>Loading</div>
            </div>
          </div>
        );
      }

      return (
        <div className="at-root">
          <style>{STYLES}</style>
          {mode === "store" ? (
            <Storefront
              products={products} settings={settings} cart={cart} setCart={setCart}
              money={money} placeOrder={placeOrder} notify={notify}
              customer={customerProfile} onSignIn={signIn} onSignUp={signUp} onSignOut={signOut} onUpdateProfile={updateCustomerProfile}
              myOrders={myOrders} myOrdersError={myOrdersError}
            />
          ) : (
            <Admin
              products={products} orders={orders}
              settings={settings} money={money}
              staff={staff} currentUser={staffProfile}
              notify={notify} placeOrder={placeOrder} onSignIn={signIn}
              onExit={() => { window.location.hash = ""; setMode("store"); }}
              onLogout={() => { auth.signOut(); window.location.hash = ""; setMode("store"); }}
              onReset={resetAll}
            />
          )}
          {toast && (
            <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "var(--ink)", color: "var(--paper)", padding: "12px 20px", borderRadius: 3, zIndex: 90, fontSize: 13, fontWeight: 500 }} className="at-rise">
              {toast}
            </div>
          )}
        </div>
      );
    }

    // Line icons for the customer-facing storefront (admin keeps its emoji set).
    const Ico = ({ size = 20, sw = 1.5, children }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{children}</svg>
    );
    const IcBag = (p) => <Ico {...p}><path d="M5 8h14l-1.2 12.2a1 1 0 01-1 .8H7.2a1 1 0 01-1-.8L5 8z" /><path d="M9 10V6.5a3 3 0 016 0V10" /></Ico>;
    const IcSearch = (p) => <Ico {...p}><circle cx="11" cy="11" r="6.5" /><path d="M20 20l-4.2-4.2" /></Ico>;
    const IcUser = (p) => <Ico {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" /></Ico>;
    const IcClose = (p) => <Ico {...p}><path d="M6 6l12 12M18 6L6 18" /></Ico>;
    const IcTruck = (p) => <Ico {...p}><path d="M3 6.5h11v9.5H3z" /><path d="M14 10h4l3 3.2V16h-7" /><circle cx="7" cy="18" r="1.8" /><circle cx="17" cy="18" r="1.8" /></Ico>;
    const IcCash = (p) => <Ico {...p}><rect x="3" y="6" width="18" height="12" rx="2" /><circle cx="12" cy="12" r="2.5" /><path d="M6.5 9.5h.01M17.5 14.5h.01" /></Ico>;
    const IcMobile = (p) => <Ico {...p}><rect x="7" y="3" width="10" height="18" rx="2.2" /><path d="M11 17.5h2" /></Ico>;
    const IcSpark = (p) => <Ico {...p}><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" /><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" /></Ico>;
    const IcArrowR = (p) => <Ico {...p}><path d="M5 12h14M13 6l6 6-6 6" /></Ico>;
    const IcArrowL = (p) => <Ico {...p}><path d="M19 12H5M11 6l-6 6 6 6" /></Ico>;
    const IcPlus = (p) => <Ico {...p}><path d="M12 5v14M5 12h14" /></Ico>;
    const IcMinus = (p) => <Ico {...p}><path d="M5 12h14" /></Ico>;
    const IcTrash = (p) => <Ico {...p}><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13" /></Ico>;
    const IcCheck = (p) => <Ico {...p}><path d="M5 12.5l4.5 4.5L19 7.5" /></Ico>;
    const IcLock = (p) => <Ico {...p}><rect x="5" y="11" width="14" height="9.5" rx="2" /><path d="M8 11V8a4 4 0 018 0v3" /></Ico>;
    const IcReceipt = (p) => <Ico {...p}><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" /><path d="M9 8h6M9 12h6" /></Ico>;
    const IcRuler = (p) => <Ico {...p}><rect x="2.5" y="8" width="19" height="8" rx="1.5" /><path d="M7 8v3M11 8v4M15 8v3M19 8v4" /></Ico>;

    const Choice = ({ on, onClick, label, sub, right }) => (
      <button type="button" onClick={onClick} className={"sf-choice" + (on ? " on" : "")}>
        <span className="sf-radio" />
        <span style={{ flex: 1, minWidth: 0 }}>
          <span style={{ fontWeight: 600 }}>{label}</span>
          {sub && <span className="sf-choice-sub">{sub}</span>}
        </span>
        {right}
      </button>
    );

    const waLink = (settings, text) => `https://wa.me/${bdIntl(settings.whatsapp)}` + (text ? `?text=${encodeURIComponent(text)}` : "");

    function Storefront({ products, settings, cart, setCart, money, placeOrder, notify, customer, onSignIn, onSignUp, onSignOut, onUpdateProfile, myOrders, myOrdersError }) {
      const [view, setView] = useState("home");
      const [quick, setQuick] = useState(null);
      const [cartOpen, setCartOpen] = useState(false);
      const [cat, setCat] = useState("All");
      const [q, setQ] = useState("");
      const [sort, setSort] = useState("featured");
      const [confirmedOrder, setConfirmedOrder] = useState(null);
      const [authOpen, setAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState("signin");
      const [ordersOpen, setOrdersOpen] = useState(false);
      const [afterAuth, setAfterAuth] = useState(null);
      const [editingProfile, setEditingProfile] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const shopRef = useRef(null);
      const footerRef = useRef(null);

      const cartCount = cart.reduce((s, i) => s + i.qty, 0);
      const addToCart = (product, size) => {
        setCart(c => {
          const key = product.id + "|" + size;
          const existing = c.find(i => i.key === key);
          if (existing) return c.map(i => i.key === key ? { ...i, qty: i.qty + 1 } : i);
          return [...c, { key, id: product.id, name: product.name, category: product.category, size, price: product.price, colorKey: product.colorKey, image: product.image, qty: 1 }];
        });
        setQuick(null); setCartOpen(true); notify(`Added ${product.name} (${size})`);
      };
      const updateQty = (key, d) => setCart(c => c.map(i => i.key === key ? { ...i, qty: Math.max(1, i.qty + d) } : i));
      const removeItem = (key) => setCart(c => c.filter(i => i.key !== key));

      const active = useMemo(() => products.filter(p => p.status === "active"), [products]);
      const cats = useMemo(() => CATEGORIES.filter(c => active.some(p => p.category === c)), [active]);
      const visible = useMemo(() => {
        let list = active;
        if (cat !== "All") list = list.filter(p => p.category === cat);
        if (q.trim()) list = list.filter(p => (p.name + p.category).toLowerCase().includes(q.toLowerCase()));
        if (sort === "low") list = [...list].sort((a, b) => a.price - b.price);
        if (sort === "high") list = [...list].sort((a, b) => b.price - a.price);
        return list;
      }, [active, cat, q, sort]);

      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const toShop = () => shopRef.current && shopRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
      const pickCat = (c) => { setCat(c); toShop(); };
      const openSignIn = () => { setAuthMode("signin"); setAfterAuth(null); setAuthOpen(true); };

      const completeOrder = async (customerInfo, payment, shipping) => {
        const orderData = {
          createdAt: Date.now(),
          items: cart.map(({ key, ...rest }) => rest),
          subtotal, shipping, total: subtotal + shipping,
          status: payment.method === "card" ? "paid" : "pending",
          customer: customerInfo, payment, customerId: customer?.id || null,
        };
        const id = await placeOrder(orderData);
        setConfirmedOrder({ ...orderData, id }); setCart([]); setView("confirm");
      };

      if (view === "checkout") {
        return <Checkout cart={cart} subtotal={subtotal} settings={settings} money={money} customer={customer} notify={notify}
          onBack={() => setView("home")} onComplete={completeOrder} />;
      }
      if (view === "confirm" && confirmedOrder) {
        return <Confirmation order={confirmedOrder} settings={settings} money={money} onDone={() => { setView("home"); setConfirmedOrder(null); }} />;
      }

      const brandParts = settings.brand.split(" ");
      const Wordmark = () => (
        <span className="sf-wordmark">
          {brandParts[0]}
          {brandParts.length > 1 && <small>{brandParts.slice(1).join(" ")}</small>}
        </span>
      );

      return (
        <div>
          <div className="sf-announce">
            Cash on delivery all over Bangladesh <span className="sf-hide-sm">· Inside Dhaka <b>{money(settings.shipInsideDhaka)}</b> · Outside Dhaka <b>{money(settings.shipOutsideDhaka)}</b></span>
          </div>

          <header className="sf-header">
            <div className="sf-wrap sf-header-in">
              <div className="sf-nav">
                <button className={"sf-navlink" + (cat === "All" ? " on" : "")} onClick={() => pickCat("All")}>Shop all</button>
                {cats.slice(0, 3).map(c => (
                  <button key={c} className={"sf-navlink" + (cat === c ? " on" : "")} onClick={() => pickCat(c)}>{c}</button>
                ))}
                <button className="sf-navlink" onClick={() => footerRef.current?.scrollIntoView({ behavior: "smooth" })}>Contact</button>
              </div>

              <button className="sf-brand" onClick={() => { setView("home"); setCat("All"); setQ(""); window.scrollTo({ top: 0, behavior: "smooth" }); }} aria-label={settings.brand + " home"}>
                {settings.logo && <img src={settings.logo} alt="" />}
                <Wordmark />
              </button>

              <div className="sf-actions">
                <button className="sf-icon-btn" aria-label="Search" onClick={() => { toShop(); setTimeout(() => document.getElementById("sf-search")?.focus({ preventScroll: true }), 400); }}><IcSearch /></button>
                {customer ? (
                  <button className="sf-icon-btn" aria-label="Account" onClick={() => setMenuOpen(o => !o)}>
                    <IcUser /><span className="sf-hide-sm">{customer.name.split(" ")[0]}</span>
                  </button>
                ) : (
                  <button className="sf-icon-btn" aria-label="Sign in" onClick={openSignIn}>
                    <IcUser /><span className="sf-hide-sm">Sign in</span>
                  </button>
                )}
                <button className="sf-icon-btn" aria-label="Shopping bag" onClick={() => setCartOpen(true)}>
                  <IcBag />
                  {cartCount > 0 && <span className="sf-count">{cartCount}</span>}
                </button>

                {menuOpen && customer && (
                  <>
                    <div style={{ position: "fixed", inset: 0, zIndex: 44 }} onClick={() => setMenuOpen(false)} />
                    <div className="sf-menu">
                      <div className="sf-menu-head">
                        <div style={{ fontWeight: 600, fontSize: 14 }}>{customer.name}</div>
                        <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 2, overflow: "hidden", textOverflow: "ellipsis" }}>{customer.email}</div>
                      </div>
                      <button onClick={() => { setMenuOpen(false); setOrdersOpen(true); }}>My orders {myOrders.length > 0 && <span style={{ color: "var(--muted)", fontSize: 12 }}>{myOrders.length}</span>}</button>
                      <button onClick={() => { setMenuOpen(false); setEditingProfile(true); }}>Profile & address</button>
                      <button onClick={() => { setMenuOpen(false); onSignOut(); }} style={{ color: "var(--warn)" }}>Sign out</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          </header>

          {settings.bannerImage ? (
            <div className="sf-banner">
              <img src={settings.bannerImage} alt={settings.brand + " banner"} />
            </div>
          ) : (
            <section className="sf-hero">
              {settings.logo && <img src={settings.logo} alt="" />}
              <h1>{settings.tagline}</h1>
              <button onClick={toShop} className="at-btn at-btn-dark" style={{ marginTop: 30 }}>Shop the collection <IcArrowR size={16} /></button>
            </section>
          )}

          <div className="sf-trust">
            <div className="sf-wrap sf-trust-in">
              {[
                { ic: <IcCash />, t: "Cash on delivery", s: "Pay when it arrives" },
                { ic: <IcTruck />, t: "Nationwide delivery", s: `Dhaka ${money(settings.shipInsideDhaka)} · Outside ${money(settings.shipOutsideDhaka)}` },
                { ic: <IcMobile />, t: "bKash & Nagad", s: "Pay by mobile banking" },
                { ic: <IcSpark />, t: "Handpicked quality", s: "Every piece chosen with care" },
              ].map(x => (
                <div key={x.t} className="sf-trust-item">
                  <span className="sf-trust-ic">{x.ic}</span>
                  <div style={{ minWidth: 0 }}><div className="sf-trust-t">{x.t}</div><div className="sf-trust-s">{x.s}</div></div>
                </div>
              ))}
            </div>
          </div>

          <section ref={shopRef} className="sf-wrap sf-shop">
            <div className="sf-shop-head">
              <div>
                <div className="sf-eyebrow">The collection</div>
                <h2 className="sf-h2">{cat === "All" ? "Shop all" : cat}</h2>
              </div>
              <div className="sf-tools">
                <div className="sf-search">
                  <IcSearch size={17} />
                  <input id="sf-search" value={q} onChange={e => setQ(e.target.value)} placeholder="Search products" className="at-field" />
                </div>
                <select value={sort} onChange={e => setSort(e.target.value)} className="at-field sf-select" aria-label="Sort">
                  <option value="featured">Featured</option>
                  <option value="low">Price: low to high</option>
                  <option value="high">Price: high to low</option>
                </select>
              </div>
            </div>

            {cats.length > 1 && (
              <div className="sf-tabs">
                <button className={"sf-tab" + (cat === "All" ? " on" : "")} onClick={() => setCat("All")}>All<span>{active.length}</span></button>
                {cats.map(c => (
                  <button key={c} className={"sf-tab" + (cat === c ? " on" : "")} onClick={() => setCat(c)}>
                    {c}<span>{active.filter(p => p.category === c).length}</span>
                  </button>
                ))}
              </div>
            )}
            {cats.length <= 1 && <div style={{ height: 32 }} />}

            {visible.length === 0 ? (
              <div style={{ textAlign: "center", padding: "72px 20px", background: "var(--surface)", border: "1px dashed var(--line-strong)", borderRadius: 14 }}>
                <div className="sf-serif" style={{ fontSize: 26, fontWeight: 600 }}>Nothing here yet</div>
                <p style={{ fontSize: 14, color: "var(--muted)", marginTop: 8 }}>Try another category or clear your search.</p>
                {(q || cat !== "All") && <button onClick={() => { setQ(""); setCat("All"); }} className="at-btn at-btn-ghost at-btn-sm" style={{ marginTop: 18 }}>Clear filters</button>}
              </div>
            ) : (
              <div className="sf-grid">
                {visible.map(p => (
                  <article key={p.id} className="sf-card at-rise" onClick={() => setQuick(p)} tabIndex={0} onKeyDown={e => { if (e.key === "Enter") setQuick(p); }}>
                    <div className="sf-card-media">
                      <ProductImage product={p} />
                      {p.stock === 0 && <span className="sf-card-badge" style={{ background: "var(--ink)", color: "#fff" }}>Sold out</span>}
                      {p.stock > 0 && p.stock <= 5 && <span className="sf-card-badge" style={{ background: "#fff", color: "var(--warn)" }}>Only {p.stock} left</span>}
                      <div className="sf-card-quick">{p.stock === 0 ? "View details" : "Quick add"}</div>
                    </div>
                    <div className="sf-card-body">
                      <div className="sf-card-cat">{p.category}</div>
                      <div className="sf-card-name">{p.name}</div>
                      <div className="sf-card-row">
                        <span className="sf-price">{money(p.price)}</span>
                        {p.sizes?.length > 0 && <span className="sf-sizes">{p.sizes.join(" · ")}</span>}
                      </div>
                    </div>
                  </article>
                ))}
              </div>
            )}
          </section>

          <section className="sf-story">
            <div className="sf-wrap sf-story-in">
              <div>
                <div className="sf-eyebrow" style={{ color: "#D9B66F" }}>Why {settings.brand}</div>
                <h2>{settings.tagline}</h2>
                <p>Not sure about a size or want to see more photos? Message us on WhatsApp and we'll help you choose before you order.</p>
                <div style={{ display: "flex", gap: 12, marginTop: 28, flexWrap: "wrap" }}>
                  <a href={waLink(settings, `Hi ${settings.brand}, I have a question about an item.`)} target="_blank" rel="noopener noreferrer" className="at-btn sf-btn-gold" style={{ textDecoration: "none" }}>
                    <Whatsapp size={18} /> Chat on WhatsApp
                  </a>
                  <button onClick={toShop} className="at-btn sf-btn-line">Browse the shop</button>
                </div>
              </div>
              <div className="sf-story-list">
                {[
                  { ic: <IcRuler />, t: "Help with sizing", s: "Tell us your usual size and we'll guide you to the right fit." },
                  { ic: <IcCash />, t: "Pay the way you like", s: "Cash on delivery, bKash, Nagad or card." },
                  { ic: <IcReceipt />, t: "Track every order", s: "Sign in to see your order history and download invoices." },
                ].map(x => (
                  <div key={x.t} className="sf-story-item">
                    {x.ic}
                    <div><div style={{ fontWeight: 600, fontSize: 15 }}>{x.t}</div><div style={{ fontSize: 13, color: "rgba(243,234,219,.65)", marginTop: 4, lineHeight: 1.55 }}>{x.s}</div></div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <footer ref={footerRef} className="sf-footer">
            <div className="sf-wrap sf-footer-grid">
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  {settings.logo && <img src={settings.logo} alt="" style={{ height: 52, width: 52, borderRadius: "50%", objectFit: "cover" }} />}
                  <span className="sf-wordmark" style={{ color: "#fff" }}>{brandParts[0]}{brandParts.length > 1 && <small>{brandParts.slice(1).join(" ")}</small>}</span>
                </div>
                <p style={{ color: "rgba(233,225,210,.6)", fontSize: 13.5, lineHeight: 1.7, marginTop: 18, maxWidth: 280 }}>{settings.tagline}</p>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 20 }}>
                  {["Cash on delivery", "bKash", "Nagad", "Card"].map(x => <span key={x} className="sf-paychip">{x}</span>)}
                </div>
              </div>
              <div>
                <h4>Shop</h4>
                <button className="sf-flink" onClick={() => pickCat("All")}>All products</button>
                {cats.map(c => <button key={c} className="sf-flink" onClick={() => pickCat(c)}>{c}</button>)}
              </div>
              <div>
                <h4>Contact</h4>
                <div className="sf-flink" style={{ cursor: "default" }}><span style={{ color: "#C9A55E" }}><MapPin /></span>{settings.address}</div>
                <a href={`tel:+${bdIntl(settings.phone)}`}><span style={{ color: "#C9A55E" }}><Phone /></span>{settings.phone}</a>
                <a href={waLink(settings)} target="_blank" rel="noopener noreferrer"><Whatsapp />{settings.whatsapp}</a>
              </div>
              <div>
                <h4>Follow us</h4>
                <a href={settings.facebook} target="_blank" rel="noopener noreferrer"><Facebook /> Facebook page</a>
                {customer ? (
                  <button className="sf-flink" onClick={() => setOrdersOpen(true)}><IcReceipt size={18} /> My orders</button>
                ) : (
                  <button className="sf-flink" onClick={openSignIn}><IcUser size={18} /> Sign in / Register</button>
                )}
              </div>
            </div>
            <div className="sf-wrap" style={{ borderTop: "1px solid rgba(255,255,255,.08)", padding: "20px 24px 26px", display: "flex", flexWrap: "wrap", gap: 14, justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: 12, color: "rgba(233,225,210,.5)" }}>© {new Date().getFullYear()} {settings.brand}. All rights reserved.</div>
              <a href={settings.adminUrl} target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, color: "rgba(233,225,210,.45)", textDecoration: "none" }}>
                <IcLock size={14} /> Admin
              </a>
            </div>
          </footer>

          <a href={waLink(settings, `Hi ${settings.brand}!`)} target="_blank" rel="noopener noreferrer" className="sf-wa-float" aria-label="Chat on WhatsApp"><Whatsapp size={54} /></a>

          {quick && <QuickView product={quick} settings={settings} money={money} onClose={() => setQuick(null)} onAdd={addToCart} />}

          {cartOpen && (
            <>
              <div className="at-scrim" onClick={() => setCartOpen(false)} />
              <aside className="at-drawer at-scroll" style={{ background: "var(--surface)" }}>
                <div className="sf-panel-head">
                  <div className="sf-panel-title">Your bag <span style={{ fontFamily: "var(--body)", fontSize: 14, color: "var(--muted)", fontWeight: 500 }}>({cartCount})</span></div>
                  <button className="sf-close" onClick={() => setCartOpen(false)} aria-label="Close"><IcClose /></button>
                </div>
                <div style={{ flex: 1, overflow: "auto" }} className="at-scroll">
                  {cart.length === 0 ? (
                    <div style={{ textAlign: "center", padding: "80px 24px", color: "var(--muted)" }}>
                      <span style={{ display: "inline-flex", width: 72, height: 72, borderRadius: "50%", background: "var(--gold-tint)", color: "var(--gold-deep)", alignItems: "center", justifyContent: "center" }}><IcBag size={30} /></span>
                      <div className="sf-serif" style={{ marginTop: 18, fontSize: 24, fontWeight: 600, color: "var(--ink)" }}>Your bag is empty</div>
                      <p style={{ fontSize: 13, marginTop: 6 }}>Find something you love in the collection.</p>
                      <button onClick={() => { setCartOpen(false); toShop(); }} className="at-btn at-btn-dark at-btn-sm" style={{ marginTop: 20 }}>Start shopping</button>
                    </div>
                  ) : cart.map(i => (
                    <div key={i.key} style={{ display: "flex", gap: 14, padding: "18px 24px", borderBottom: "1px solid var(--line)" }}>
                      <div className="sf-thumb" style={{ width: 84, height: 104 }}><ProductImage product={i} /></div>
                      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
                          <div className="sf-serif" style={{ fontSize: 19, fontWeight: 600, lineHeight: 1.15 }}>{i.name}</div>
                          <button onClick={() => removeItem(i.key)} style={{ color: "var(--muted)", flexShrink: 0 }} aria-label="Remove"><IcTrash size={17} /></button>
                        </div>
                        <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 4 }}>Size {i.size} · {money(i.price)}</div>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: "auto", paddingTop: 10 }}>
                          <div className="sf-qty">
                            <button onClick={() => updateQty(i.key, -1)} aria-label="Decrease"><IcMinus size={14} /></button>
                            <span>{i.qty}</span>
                            <button onClick={() => updateQty(i.key, 1)} aria-label="Increase"><IcPlus size={14} /></button>
                          </div>
                          <span className="sf-price" style={{ fontSize: 15 }}>{money(i.price * i.qty)}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
                {cart.length > 0 && (
                  <div style={{ borderTop: "1px solid var(--line)", padding: "20px 24px 24px", background: "var(--paper)" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 15, fontWeight: 600 }}>
                      <span>Subtotal</span><span className="sf-price">{money(subtotal)}</span>
                    </div>
                    <div style={{ fontSize: 12, color: "var(--muted)", margin: "4px 0 16px" }}>Delivery charge is added at checkout.</div>
                    <button onClick={() => {
                      setCartOpen(false);
                      if (!customer) { setAuthMode("signin"); setAfterAuth("checkout"); setAuthOpen(true); }
                      else setView("checkout");
                    }} className="at-btn at-btn-dark" style={{ width: "100%", padding: 16 }}>
                      Checkout <IcArrowR size={16} />
                    </button>
                    <button onClick={() => setCartOpen(false)} style={{ width: "100%", marginTop: 12, fontSize: 13, color: "var(--ink-soft)", textDecoration: "underline", textUnderlineOffset: 3 }}>Continue shopping</button>
                  </div>
                )}
              </aside>
            </>
          )}

          {authOpen && (
            <AccountAuth
              mode={authMode} setMode={setAuthMode}
              onSignIn={onSignIn} onSignUp={onSignUp}
              onClose={() => { setAuthOpen(false); setAfterAuth(null); }}
              onSuccess={() => {
                setAuthOpen(false);
                if (afterAuth === "checkout") { setAfterAuth(null); setView("checkout"); }
              }}
            />
          )}

          {editingProfile && customer && (
            <EditProfile customer={customer} onSave={onUpdateProfile} notify={notify} onClose={() => setEditingProfile(false)} />
          )}

          {ordersOpen && customer && (
            <MyOrders orders={myOrders} error={myOrdersError} money={money} onClose={() => setOrdersOpen(false)} />
          )}
        </div>
      );
    }

    const ModalShell = ({ title, sub, onClose, maxWidth = 440, children }) => (
      <>
        <div className="at-scrim" onClick={onClose} />
        <div className="at-modal" onClick={onClose}>
          <div className="at-card at-rise" style={{ maxWidth, width: "100%", padding: 0, marginTop: 32, borderRadius: 16, overflow: "hidden", boxShadow: "0 30px 80px rgba(20,14,6,.25)" }} onClick={e => e.stopPropagation()}>
            <div className="sf-panel-head" style={{ alignItems: "flex-start" }}>
              <div>
                <div className="sf-panel-title">{title}</div>
                {sub && <p style={{ color: "var(--muted)", fontSize: 13, marginTop: 8 }}>{sub}</p>}
              </div>
              <button className="sf-close" onClick={onClose} aria-label="Close" style={{ marginTop: -6, marginRight: -8 }}><IcClose /></button>
            </div>
            {children}
          </div>
        </div>
      </>
    );

    const LocationChoice = ({ value, onChange, settings, money }) => (
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {[{ id: "dhaka", label: "Inside Dhaka", rate: settings?.shipInsideDhaka }, { id: "outside", label: "Outside Dhaka", rate: settings?.shipOutsideDhaka }].map(opt => (
          <Choice key={opt.id} on={value === opt.id} onClick={() => onChange(opt.id)} label={opt.label}
            sub={settings && money ? "Delivery " + money(opt.rate) : null} />
        ))}
      </div>
    );

    function EditProfile({ customer, onSave, notify, onClose }) {
      const [form, setForm] = useState({ name: customer.name || "", phone: customer.phone || "", address: customer.address || "", location: customer.location || "dhaka" });
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);
      const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

      const submit = async () => {
        if (busy) return;
        setErr("");
        if (!form.name.trim()) return setErr("Please enter your name.");
        if (!form.phone.trim()) return setErr("Please enter your mobile number.");
        setBusy(true);
        const result = await onSave({ name: form.name.trim(), phone: form.phone.trim(), address: form.address.trim(), location: form.location });
        setBusy(false);
        if (!result.ok) return setErr(result.error);
        notify("Profile updated");
        onClose();
      };

      return (
        <ModalShell title="Your account" sub="We'll use these details to prefill checkout." onClose={onClose}>
          <div style={{ padding: "22px 24px 26px" }}>
            <Field label="Email" value={customer.email} disabled style={{ opacity: 0.6 }} />
            <Field label="Full name" value={form.name} onChange={set("name")} />
            <Field label="Mobile number" value={form.phone} onChange={set("phone")} placeholder="01XXXXXXXXX" />
            <Field label="Delivery address" value={form.address} onChange={set("address")} placeholder="House, road, area" />
            <label className="at-label">Delivery location</label>
            <LocationChoice value={form.location} onChange={(v) => setForm(f => ({ ...f, location: v }))} />
            {err && <p style={{ color: "var(--warn)", fontSize: 13, marginTop: 12 }}>{err}</p>}
            <button onClick={submit} disabled={busy} className="at-btn at-btn-dark" style={{ width: "100%", marginTop: 22, padding: 15 }}>{busy ? "Saving…" : "Save changes"}</button>
          </div>
        </ModalShell>
      );
    }

    function MyOrders({ orders, error, money, onClose }) {
      return (
        <ModalShell title="My orders" sub={orders.length ? `${orders.length} order${orders.length !== 1 ? "s" : ""}` : null} onClose={onClose} maxWidth={640}>
          <div style={{ maxHeight: "70vh", overflow: "auto", padding: "8px 24px 24px" }} className="at-scroll">
            {error ? (
              <div style={{ textAlign: "center", padding: "48px 0", color: "var(--warn)", fontSize: 14 }}>Couldn't load your orders right now. Please try again shortly.</div>
            ) : orders.length === 0 ? (
              <div style={{ textAlign: "center", padding: "48px 0", color: "var(--muted)" }}>
                <span style={{ display: "inline-flex", width: 64, height: 64, borderRadius: "50%", background: "var(--gold-tint)", color: "var(--gold-deep)", alignItems: "center", justifyContent: "center" }}><IcReceipt size={26} /></span>
                <p style={{ marginTop: 14, fontSize: 14 }}>You haven't placed any orders yet.</p>
              </div>
            ) : orders.map(o => (
              <div key={o.id} style={{ border: "1px solid var(--line)", borderRadius: 12, padding: 18, marginTop: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 700 }}>{o.id}</div>
                    <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 2 }}>{new Date(o.createdAt).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })}</div>
                  </div>
                  <span className="at-badge" style={{ background: STATUS_META[o.status].bg, color: STATUS_META[o.status].fg, borderRadius: 20 }}>{STATUS_META[o.status].label}</span>
                </div>
                <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 6 }}>
                  {o.items.map((it, idx) => (
                    <div key={idx} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "var(--ink-soft)", gap: 12 }}>
                      <span>{it.name} <span style={{ color: "var(--muted)" }}>· {it.size} × {it.qty}</span></span>
                      <span className="at-mono">{money(it.price * it.qty)}</span>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12, paddingTop: 12, borderTop: "1px dashed var(--line-strong)", fontWeight: 700, fontSize: 14 }}>
                  <span>Total</span><span className="at-mono">{money(o.total)}</span>
                </div>
              </div>
            ))}
          </div>
        </ModalShell>
      );
    }

    function AccountAuth({ mode, setMode, onSignIn, onSignUp, onClose, onSuccess }) {
      const [form, setForm] = useState({ name: "", email: "", phone: "", location: "dhaka", password: "", confirm: "" });
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);
      const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

      const submit = async () => {
        if (busy) return;
        setErr("");
        if (mode === "signup") {
          if (!form.name.trim()) return setErr("Please enter your full name.");
          if (!/\S+@\S+\.\S+/.test(form.email)) return setErr("Please enter a valid email.");
          if (!form.phone.trim()) return setErr("Please enter your mobile number.");
          if (form.password.length < 6) return setErr("Password must be at least 6 characters.");
          if (form.password !== form.confirm) return setErr("Passwords don't match.");
          setBusy(true);
          const result = await onSignUp({ name: form.name, email: form.email, phone: form.phone, location: form.location, password: form.password });
          setBusy(false);
          if (!result.ok) return setErr(result.error);
          onSuccess();
        } else {
          if (!form.email.trim() || !form.password) return setErr("Enter your email and password.");
          setBusy(true);
          const result = await onSignIn({ email: form.email, password: form.password });
          setBusy(false);
          if (!result.ok) return setErr(result.error);
          onSuccess();
        }
      };
      const onEnter = (e) => { if (e.key === "Enter") submit(); };

      return (
        <ModalShell
          title={mode === "signup" ? "Create your account" : "Welcome back"}
          sub={mode === "signup" ? "You'll need an account to place an order." : "Sign in to continue to checkout and track your orders."}
          onClose={onClose}>
          <div style={{ padding: "22px 24px 26px" }}>
            {mode === "signup" && <Field label="Full name" value={form.name} onChange={set("name")} placeholder="Your name" />}
            <Field label="Email" type="email" value={form.email} onChange={set("email")} placeholder="you@email.com" />
            {mode === "signup" && (
              <>
                <Field label="Mobile number" value={form.phone} onChange={set("phone")} placeholder="01XXXXXXXXX" />
                <label className="at-label">Delivery location</label>
                <div style={{ marginBottom: 14 }}><LocationChoice value={form.location} onChange={(v) => setForm(f => ({ ...f, location: v }))} /></div>
              </>
            )}
            <Field label="Password" type="password" value={form.password} onChange={set("password")} onKeyDown={mode === "signup" ? undefined : onEnter} placeholder="••••••" />
            {mode === "signup" && <Field label="Confirm password" type="password" value={form.confirm} onChange={set("confirm")} onKeyDown={onEnter} placeholder="••••••" />}
            {err && <p style={{ color: "var(--warn)", fontSize: 13, marginTop: -4 }}>{err}</p>}
            <button onClick={submit} disabled={busy} className="at-btn at-btn-dark" style={{ width: "100%", marginTop: 10, padding: 15 }}>
              {busy ? "Please wait…" : mode === "signup" ? "Create account" : "Sign in"}
            </button>
            <div style={{ textAlign: "center", marginTop: 18, fontSize: 13, color: "var(--muted)" }}>
              {mode === "signup" ? "Already have an account? " : "New to us? "}
              <button onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setErr(""); }} style={{ color: "var(--ink)", fontWeight: 600, textDecoration: "underline", textUnderlineOffset: 3 }}>
                {mode === "signup" ? "Sign in" : "Create an account"}
              </button>
            </div>
          </div>
        </ModalShell>
      );
    }

    function QuickView({ product, settings, money, onClose, onAdd }) {
      const [size, setSize] = useState(product.sizes?.length === 1 ? product.sizes[0] : null);
      const soldOut = product.stock === 0;
      return (
        <>
          <div className="at-scrim" onClick={onClose} />
          <div className="at-modal" onClick={onClose}>
            <div className="sf-qv at-rise" onClick={e => e.stopPropagation()}>
              <div className="sf-qv-media">
                <ProductImage product={product} />
                {soldOut && <span className="sf-card-badge" style={{ background: "var(--ink)", color: "#fff" }}>Sold out</span>}
              </div>
              <div className="sf-qv-body">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span className="sf-card-cat">{product.category}</span>
                  <button className="sf-close" onClick={onClose} aria-label="Close" style={{ marginRight: -10 }}><IcClose /></button>
                </div>
                <h2 className="sf-serif" style={{ fontSize: 38, fontWeight: 600, margin: "6px 0 0", lineHeight: 1.05 }}>{product.name}</h2>
                <div className="sf-price" style={{ fontSize: 22, marginTop: 12 }}>{money(product.price)}</div>
                {product.description && <p style={{ color: "var(--ink-soft)", fontSize: 14.5, lineHeight: 1.7, marginTop: 16 }}>{product.description}</p>}

                <div style={{ marginTop: 24 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
                    <span className="at-label" style={{ marginBottom: 0 }}>Size{size ? `: ${size}` : ""}</span>
                    {!soldOut && product.stock <= 5 && <span style={{ fontSize: 12, color: "var(--warn)", fontWeight: 600 }}>Only {product.stock} left</span>}
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                    {product.sizes.map(s => (
                      <button key={s} onClick={() => setSize(s)} disabled={soldOut} className={"sf-size" + (size === s ? " on" : "")}>{s}</button>
                    ))}
                  </div>
                </div>

                <button disabled={soldOut || !size} onClick={() => onAdd(product, size)} className="at-btn at-btn-dark" style={{ width: "100%", padding: 16, marginTop: 24 }}>
                  {soldOut ? "Sold out" : !size ? "Select a size" : <>Add to bag · {money(product.price)}</>}
                </button>
                <a href={waLink(settings, `Hi, I'd like to order "${product.name}"${size ? ` (size ${size})` : ""} – ${money(product.price)}`)} target="_blank" rel="noopener noreferrer"
                  className="at-btn at-btn-ghost" style={{ width: "100%", padding: 14, marginTop: 10, textDecoration: "none" }}>
                  <Whatsapp size={18} /> Order on WhatsApp
                </a>

                <div className="sf-perks">
                  <div><IcTruck size={18} /> Inside Dhaka {money(settings.shipInsideDhaka)} · Outside Dhaka {money(settings.shipOutsideDhaka)}</div>
                  <div><IcCash size={18} /> Cash on delivery, bKash, Nagad or card</div>
                </div>
              </div>
            </div>
          </div>
        </>
      );
    }

    function Checkout({ cart, subtotal, settings, money, customer, notify, onBack, onComplete }) {
      const [form, setForm] = useState({ name: customer?.name || "", email: customer?.email || "", address: customer?.address || "", city: "", zip: "", card: "", exp: "", cvc: "", trxId: "" });
      const [location, setLocation] = useState(customer?.location || "dhaka");
      const [payMethod, setPayMethod] = useState("card");
      const [processing, setProcessing] = useState(false);
      const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));
      const cardFmt = (v) => v.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
      const expFmt = (v) => v.replace(/\D/g, "").slice(0, 4).replace(/(.{2})(.+)/, "$1/$2");
      const shipping = Number(location === "dhaka" ? settings.shipInsideDhaka : settings.shipOutsideDhaka) || 0;
      const total = subtotal + shipping;
      const mobileBankingNumber = payMethod === "bkash" ? settings.bkashNumber : payMethod === "nagad" ? settings.nagadNumber : "";
      const itemCount = cart.reduce((s, i) => s + i.qty, 0);

      const missing = [];
      if (!form.name.trim()) missing.push("full name");
      if (!/\S+@\S+\.\S+/.test(form.email)) missing.push("a valid email");
      if (!form.address.trim()) missing.push("address");
      if (!form.city.trim()) missing.push("city");
      if (payMethod === "card") {
        if (form.card.replace(/\s/g, "").length !== 16) missing.push("a 16-digit card number");
        if (form.exp.length !== 5) missing.push("card expiry (MM/YY)");
        if (form.cvc.length < 3) missing.push("CVC");
      }
      if ((payMethod === "bkash" || payMethod === "nagad") && form.trxId.trim().length < 6) {
        missing.push("the Transaction ID from your " + (payMethod === "bkash" ? "bKash" : "Nagad") + " Send Money");
      }
      const valid = missing.length === 0;

      const submit = () => {
        if (!valid || processing) return;
        setProcessing(true);
        setTimeout(async () => {
          let payment;
          if (payMethod === "cod") payment = { method: "cod" };
          else if (payMethod === "bkash" || payMethod === "nagad") payment = { method: payMethod, trxId: form.trxId.trim(), number: mobileBankingNumber };
          else payment = { method: "card", brand: "Visa", last4: form.card.replace(/\s/g, "").slice(-4) };
          try {
            await onComplete(
              { name: form.name, email: form.email, address: `${form.address}, ${form.city} ${form.zip}` },
              payment,
              shipping
            );
          } catch (e) {
            notify("Couldn't place order: " + e.message);
            setProcessing(false);
          }
        }, 1400);
      };

      const PAY_OPTIONS = [
        { id: "cod", label: "Cash on delivery", sub: "Pay the courier when it arrives" },
        { id: "bkash", label: "bKash", sub: "Send Money, then enter TrxID" },
        { id: "nagad", label: "Nagad", sub: "Send Money, then enter TrxID" },
        { id: "card", label: "Card", sub: "Visa / Mastercard (demo)" },
      ];

      return (
        <div style={{ minHeight: "100vh" }}>
          <header className="sf-co-head">
            <div className="sf-wrap" style={{ maxWidth: 1120, height: 72, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, fontWeight: 500, color: "var(--ink-soft)" }}><IcArrowL size={16} /> <span className="sf-hide-sm">Back to store</span></button>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                {settings.logo && <img src={settings.logo} alt="" style={{ height: 42, width: 42, borderRadius: "50%", objectFit: "cover" }} />}
                <span className="sf-wordmark" style={{ fontSize: 20 }}>{settings.brand}</span>
              </div>
              <span style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--muted)" }}><IcLock size={15} /> <span className="sf-hide-sm">Secure checkout</span></span>
            </div>
          </header>
          <div className="at-checkout-grid sf-wrap" style={{ maxWidth: 1120, padding: "36px 24px 64px", display: "grid", gridTemplateColumns: "1.5fr 1fr", gap: 32, alignItems: "start" }}>
            <div>
              <h1 className="sf-serif" style={{ fontSize: 44, fontWeight: 500, lineHeight: 1, margin: 0 }}>Checkout</h1>

              <section className="sf-co-section">
                <div className="sf-step"><b>1</b><span>Delivery details</span></div>
                <Field label="Full name" value={form.name} onChange={set("name")} placeholder="Your name" />
                <Field label="Email" value={form.email} onChange={set("email")} placeholder="you@email.com" type="email" />
                <Field label="Address" value={form.address} onChange={set("address")} placeholder="House, road, area" />
                <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 12 }}>
                  <Field label="City" value={form.city} onChange={set("city")} placeholder="Dhaka" />
                  <Field label="Post code (optional)" value={form.zip} onChange={set("zip")} placeholder="1212" />
                </div>
                <label className="at-label">Delivery location</label>
                <LocationChoice value={location} onChange={setLocation} settings={settings} money={money} />
              </section>

              <section className="sf-co-section">
                <div className="sf-step"><b>2</b><span>Payment</span></div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 18 }} className="sf-pay-grid">
                  {PAY_OPTIONS.map(o => <Choice key={o.id} on={payMethod === o.id} onClick={() => setPayMethod(o.id)} label={o.label} sub={o.sub} />)}
                </div>
                {payMethod === "card" ? (
                  <>
                    <Field label="Card number" value={form.card} onChange={(e) => setForm(f => ({ ...f, card: cardFmt(e.target.value) }))} placeholder="4242 4242 4242 4242" mono />
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                      <Field label="Expiry" value={form.exp} onChange={(e) => setForm(f => ({ ...f, exp: expFmt(e.target.value) }))} placeholder="12/28" mono />
                      <Field label="CVC" value={form.cvc} onChange={(e) => setForm(f => ({ ...f, cvc: e.target.value.replace(/\D/g, "").slice(0, 4) }))} placeholder="123" mono />
                    </div>
                    <p style={{ fontSize: 12, color: "var(--muted)" }}>Test mode: use any 16-digit number. No real charge is made.</p>
                  </>
                ) : payMethod === "cod" ? (
                  <div style={{ padding: 16, borderRadius: 10, background: "var(--gold-tint)", fontSize: 14, color: "var(--ink-soft)", lineHeight: 1.6 }}>
                    Pay in cash when your order arrives. Please keep <b>{money(total)}</b> ready for the courier.
                  </div>
                ) : (
                  <div style={{ padding: 18, borderRadius: 10, background: "var(--gold-tint)" }}>
                    <p style={{ color: "var(--ink-soft)", fontSize: 14, lineHeight: 1.6, marginBottom: 10 }}>
                      Send <b>{money(total)}</b> to this {payMethod === "bkash" ? "bKash" : "Nagad"} number using <b>Send Money</b>:
                    </p>
                    <div style={{ fontSize: 24, fontWeight: 700, letterSpacing: ".04em", marginBottom: 16, fontVariantNumeric: "tabular-nums" }}>{mobileBankingNumber}</div>
                    <Field label="Transaction ID (TrxID)" value={form.trxId} onChange={set("trxId")} placeholder="e.g. 8N7C6X5D4E" mono />
                    <p style={{ fontSize: 12, color: "var(--muted)", marginTop: -4 }}>We'll verify this before confirming your order.</p>
                  </div>
                )}
              </section>
            </div>

            <aside style={{ position: "sticky", top: 24 }}>
              <div className="sf-co-section" style={{ marginTop: 0 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 18 }}>
                  <span className="sf-serif" style={{ fontSize: 24, fontWeight: 600 }}>Order summary</span>
                  <span style={{ fontSize: 12, color: "var(--muted)" }}>{itemCount} item{itemCount !== 1 ? "s" : ""}</span>
                </div>
                {cart.map(i => (
                  <div key={i.key} style={{ display: "flex", gap: 12, marginBottom: 14, alignItems: "center" }}>
                    <div className="sf-thumb" style={{ width: 56, height: 68, position: "relative", overflow: "visible" }}>
                      <div style={{ width: "100%", height: "100%", overflow: "hidden", borderRadius: 8 }}><ProductImage product={i} /></div>

      const pendingOrders = orders.filter(o => o.status === "pending" || o.status === "paid").length;
      const lowStock = products.filter(p => p.stock > 0 && p.stock <= 5).length;
      const outOfStock = products.filter(p => p.stock === 0).length;

      const daily = useMemo(() => {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        return Array.from({ length: 7 }, (_, i) => {
          const start = new Date(today); start.setDate(start.getDate() - (6 - i));
          const startTs = start.getTime(), endTs = startTs + 86400000;
          const dayOrders = orders.filter(o => o.createdAt >= startTs && o.createdAt < endTs);
          return {
            label: start.toLocaleDateString(undefined, { weekday: "short" }),
            revenue: dayOrders.reduce((s, o) => s + o.total, 0),
            count: dayOrders.length,
          };
        });
      }, [orders]);

    function POS({ products, settings, money, placeOrder, notify, currentUser }) {
      const [cart, setCart] = useState([]);
      const [cat, setCat] = useState("All");
      const [q, setQ] = useState("");
      const [customerName, setCustomerName] = useState("");
      const [payMethod, setPayMethod] = useState("cash");
      const [trxId, setTrxId] = useState("");
      const [receipt, setReceipt] = useState(null);
      const needsTrxId = payMethod === "bkash" || payMethod === "nagad";
      const mobileBankingNumber = payMethod === "bkash" ? settings.bkashNumber : payMethod === "nagad" ? settings.nagadNumber : "";

      const sellable = useMemo(() => {
        let list = products.filter(p => p.status === "active" && p.stock > 0);
        if (cat !== "All") list = list.filter(p => p.category === cat);
        if (q.trim()) list = list.filter(p => (p.name + p.category).toLowerCase().includes(q.toLowerCase()));
        return list;
      }, [products, cat, q]);

      const addToCart = (product, size) => {
        setCart(c => {
          const key = product.id + "|" + size;
          const existing = c.find(i => i.key === key);
          if (existing) {
            if (existing.qty + 1 > product.stock) { notify(`Only ${product.stock} left of ${product.name}`); return c; }
            return c.map(i => i.key === key ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...c, { key, id: product.id, name: product.name, category: product.category, size, price: product.price, colorKey: product.colorKey, image: product.image, qty: 1 }];
        });
      };
      const updateQty = (key, d) => setCart(c => c.map(i => i.key === key ? { ...i, qty: Math.max(1, i.qty + d) } : i));
      const removeItem = (key) => setCart(c => c.filter(i => i.key !== key));

      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const itemCount = cart.reduce((s, i) => s + i.qty, 0);

      const completeSale = async () => {
        if (!cart.length || (needsTrxId && trxId.trim().length < 6)) return;
        const orderData = {
          createdAt: Date.now(),
          items: cart.map(({ key, ...rest }) => rest),
          subtotal, shipping: 0, total: subtotal,
          status: "paid",
          customer: { name: customerName.trim() || "Walk-in customer", email: "-", address: "In-store purchase" },
          payment: needsTrxId ? { method: payMethod, trxId: trxId.trim(), number: mobileBankingNumber } : { method: payMethod },
          channel: "pos",
          cashier: currentUser?.name || "",
        };
        try {
          const id = await placeOrder(orderData);
          setReceipt({ ...orderData, id });
          setCart([]); setCustomerName(""); setPayMethod("cash"); setTrxId("");
          notify(`Sale completed · ${money(subtotal)}`);
        } catch (e) {
          notify("Couldn't complete sale: " + e.message);
        }
      };

      const PAY_METHODS = [{ id: "cash", label: "Cash" }, { id: "card", label: "Card" }, { id: "bkash", label: "bKash" }, { id: "nagad", label: "Nagad" }];

      return (
        <div style={{ maxWidth: 1600 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
            <span style={{ width: 40, height: 40, borderRadius: 10, background: "rgba(46,139,87,.14)", color: "#2E8B57", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}><ShoppingCart /></span>
            <div>
              <h1 className="at-disp" style={{ fontSize: 28, fontWeight: 700, margin: 0 }}>Point of Sale</h1>
              <p style={{ color: "var(--muted)", marginTop: 4, fontSize: 14 }}>Ring up an in-store sale</p>
            </div>
          </div>

          <div className="pos-grid" style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 20, alignItems: "flex-start" }}>
            <div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 16, justifyContent: "space-between" }}>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {["All", ...CATEGORIES].map(c => (
                    <button key={c} onClick={() => setCat(c)} className="at-btn at-btn-sm" style={{ background: cat === c ? "var(--accent)" : "transparent", color: cat === c ? "#fff" : "var(--ink-soft)", border: cat === c ? "none" : "1px solid var(--line-strong)" }}>{c}</button>
                  ))}
                </div>
                <div style={{ position: "relative" }}>
                  <span style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--muted)", fontSize: 16 }}><Search /></span>
                  <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search products" className="at-field" style={{ paddingLeft: 34, width: 200 }} />
                </div>
              </div>

              {sellable.length === 0 ? (
                <div className="at-card" style={{ padding: "60px 24px", textAlign: "center", color: "var(--muted)" }}>
                  Nothing in stock matches that.
                </div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(170px,1fr))", gap: 14 }}>
                  {sellable.map(p => (
                    <div key={p.id} className="at-card" style={{ overflow: "hidden" }}>
                      <div style={{ aspectRatio: "1/1", background: "var(--paper)" }}><ProductImage product={p} /></div>
                      <div style={{ padding: 10 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.25 }}>{p.name}</div>
                        <div className="at-mono" style={{ fontSize: 12, marginTop: 4, marginBottom: 8 }}>{money(p.price)} <span style={{ color: "var(--muted)" }}>· {p.stock} left</span></div>
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                          {p.sizes.map(s => (
                            <button key={s} onClick={() => addToCart(p, s)} className="at-mono" style={{ padding: "5px 9px", fontSize: 11, border: "1px solid var(--line-strong)", borderRadius: 2, background: "transparent" }}>{s}</button>
                          ))}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="at-card" style={{ padding: 20, position: "sticky", top: 24, borderTop: "3px solid #2E8B57" }}>
              <div className="at-eyebrow" style={{ marginBottom: 14 }}>Current sale · {itemCount} item{itemCount !== 1 ? "s" : ""}</div>

              <div style={{ maxHeight: 320, overflow: "auto", marginBottom: 14 }} className="at-scroll">
                {cart.length === 0 ? (
                  <p style={{ color: "var(--muted)", fontSize: 13, padding: "20px 0", textAlign: "center" }}>Tap a size above to add it to the sale.</p>
                ) : cart.map(i => (
                  <div key={i.key} style={{ display: "flex", gap: 10, padding: "10px 0", borderBottom: "1px solid var(--line)" }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 600 }}>{i.name}</div>
                      <div className="at-mono" style={{ fontSize: 11, color: "var(--muted)" }}>Size {i.size} · {money(i.price)}</div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <button onClick={() => updateQty(i.key, -1)} style={{ padding: "3px 7px" }}><Minus /></button>
                      <span className="at-mono" style={{ minWidth: 16, textAlign: "center", fontSize: 13 }}>{i.qty}</span>
                      <button onClick={() => updateQty(i.key, 1)} style={{ padding: "3px 7px" }}><Plus /></button>
                      <button onClick={() => removeItem(i.key)} style={{ color: "var(--muted)", marginLeft: 4 }}><Trash2 /></button>
                    </div>
                  </div>
                ))}
              </div>

              <div style={{ marginBottom: 14 }}>
                <label className="at-label">Customer (optional)</label>
                <input className="at-field" value={customerName} onChange={e => setCustomerName(e.target.value)} placeholder="Walk-in customer" />
              </div>

              <div style={{ marginBottom: 16 }}>
                <label className="at-label">Payment method</label>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8 }}>
                  {PAY_METHODS.map(m => (
                    <button key={m.id} onClick={() => setPayMethod(m.id)} className="at-mono" style={{ padding: "9px 6px", fontSize: 11, border: "1px solid " + (payMethod === m.id ? "var(--ink)" : "var(--line-strong)"), background: payMethod === m.id ? "var(--ink)" : "transparent", color: payMethod === m.id ? "var(--paper)" : "var(--ink)", borderRadius: 2 }}>{m.label}</button>
                  ))}
                </div>
                {needsTrxId && (
                  <div style={{ marginTop: 12 }}>
                    <p className="at-mono" style={{ fontSize: 11, color: "var(--muted)", marginBottom: 8 }}>
                      Check the customer sent {money(subtotal)} to {mobileBankingNumber}, then enter their TrxID:
                    </p>
                    <input className="at-field at-mono" value={trxId} onChange={e => setTrxId(e.target.value)} placeholder="Transaction ID (TrxID)" />
                  </div>
                )}
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 15, marginBottom: 14, paddingTop: 14, borderTop: "1px solid var(--line)" }}>
                <span className="at-disp" style={{ fontWeight: 700 }}>Total</span>
                <span className="at-mono" style={{ fontWeight: 700, fontSize: 18 }}>{money(subtotal)}</span>
              </div>

              <button onClick={completeSale} disabled={!cart.length || (needsTrxId && trxId.trim().length < 6)} className="at-btn at-btn-primary" style={{ width: "100%" }}>
                Complete sale · {money(subtotal)}
              </button>
            </div>
          </div>

          {receipt && (
            <>
              <div className="at-scrim" onClick={() => setReceipt(null)} />
              <div className="at-modal">
                <div className="at-card at-rise" style={{ width: "100%", maxWidth: 400, padding: 28, textAlign: "center" }} onClick={e => e.stopPropagation()}>
                  <div style={{ width: 52, height: 52, borderRadius: "50%", background: "var(--live-tint)", color: "var(--live)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px", fontSize: 24 }}><Check /></div>
                  <h2 className="at-disp" style={{ fontSize: 20, fontWeight: 700 }}>Sale complete</h2>
                  <div className="at-card" style={{ padding: 16, marginTop: 20, textAlign: "left", background: "var(--paper)" }}>
                    <Row label="Order number" value={receipt.id} />
                    <Row label="Items" value={receipt.items.reduce((s, i) => s + i.qty, 0)} />
                    <Row label="Payment" value={PAY_METHODS.find(m => m.id === receipt.payment.method)?.label || receipt.payment.method} />
                    {receipt.payment.trxId && <Row label="TrxID" value={receipt.payment.trxId} />}
                    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, paddingTop: 10, borderTop: "1px solid var(--line)" }}>
                      <span className="at-disp" style={{ fontWeight: 700 }}>Total</span>
                      <span className="at-mono" style={{ fontWeight: 700 }}>{money(receipt.total)}</span>
                    </div>
                  </div>
                  <button onClick={() => setReceipt(null)} className="at-btn at-btn-dark" style={{ width: "100%", marginTop: 20 }}>Start next sale</button>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    function Products({ products, money, notify }) {
      const [editing, setEditing] = useState(null);
      const [editForm, setEditForm] = useState({});
      const [adding, setAdding] = useState(false);
      const [addForm, setAddForm] = useState({});

      const updateProduct = async (id, updates) => {
        try {
          await db.collection("products").doc(id).update(updates);
          notify("Product updated");
          setEditing(null);
        } catch (e) {
          notify("Couldn't save: " + e.message);
        }
      };

      const addProduct = async () => {
        if (!addForm.name) { notify("Product name is required"); return; }
        const p = {
          id: uid("prod"),
          name: addForm.name,
          category: addForm.category || CATEGORIES[0],
          price: Number(addForm.price) || 0,
          stock: Number(addForm.stock) || 0,
          sizes: (addForm.sizes || "One Size").split(",").map(s => s.trim()).filter(Boolean),
          description: addForm.description || "",
          status: "active",
          colorKey: products.length % SWATCHES.length,
          image: addForm.image || "",
          createdAt: Date.now(),
        };
        try {
          await db.collection("products").doc(p.id).set(p);
          notify("Product added");
          setAdding(false);
          setAddForm({});
        } catch (e) {
          notify("Couldn't add product: " + e.message);
        }
      };

      return (
        <div style={{ maxWidth: 1440 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ width: 40, height: 40, borderRadius: 10, background: "rgba(124,139,110,.16)", color: "#7C8B6E", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}><Package /></span>
                <h1 className="at-disp" style={{ fontSize: 28, fontWeight: 700, margin: 0 }}>Products</h1>
              </div>
              <p style={{ color: "var(--muted)", marginTop: 4, fontSize: 14 }}>{products.length} products</p>
            </div>
            <button onClick={() => { setAdding(true); setAddForm({}); }} className="at-btn at-btn-primary">
              <Plus /> Add product
            </button>
          </div>

          <div className="at-card" style={{ overflowX: "auto", borderTop: "3px solid #7C8B6E" }}>
            <table className="at-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th style={{ width: 80 }}></th>
                </tr>
              </thead>
              <tbody>
                {products.map(p => (
                  <tr key={p.id}>
                    <td>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <div style={{ width: 48, height: 48, borderRadius: 2, overflow: "hidden", background: "var(--paper)" }}>
                          <ProductImage product={p} />
                        </div>
                        <div>
                          <div style={{ fontWeight: 500 }}>{p.name}</div>
                          <div className="at-mono" style={{ fontSize: 12, color: "var(--muted)" }}>{p.id}</div>
                        </div>
                      </div>
                    </td>
                    <td>{p.category}</td>
                    <td className="at-mono">{money(p.price)}</td>
                    <td>
                      <span style={{ color: p.stock === 0 ? "var(--warn)" : p.stock <= 5 ? "var(--warn)" : "inherit" }}>
                        {p.stock} in stock
                      </span>
                    </td>
                    <td style={{ textAlign: "right" }}>
                      <button onClick={() => { setEditing(p.id); setEditForm({}); }} style={{ color: "var(--muted)", fontSize: 16 }}><Pencil /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {editing && (() => {
            const p = products.find(x => x.id === editing);
            return (
              <>
                <div className="at-scrim" onClick={() => setEditing(null)} />
                <div className="at-modal">
                  <div className="at-card at-rise" style={{ width: "100%", maxWidth: 560, padding: 24 }} onClick={e => e.stopPropagation()}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
                      <h2 className="at-disp" style={{ fontSize: 20, fontWeight: 700 }}>Edit product</h2>
                      <button onClick={() => setEditing(null)} style={{ color: "var(--muted)", fontSize: 18 }}><X /></button>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                      <div>
                        <label className="at-label">Name</label>
                        <input className="at-field" defaultValue={p.name} onChange={e => setEditForm({ ...editForm, name: e.target.value })} />
                      </div>
                      <div>
                        <label className="at-label">Price</label>
                        <input type="number" className="at-field at-mono" defaultValue={p.price} onChange={e => setEditForm({ ...editForm, price: Number(e.target.value) })} />
                      </div>
                      <div>
                        <label className="at-label">Stock</label>
                        <input type="number" className="at-field at-mono" defaultValue={p.stock} onChange={e => setEditForm({ ...editForm, stock: Number(e.target.value) })} />
                      </div>
                      <ImagePicker value={editForm.image ?? p.image} onChange={img => setEditForm({ ...editForm, image: img })} idSuffix={p.id} />
                      <div style={{ display: "flex", gap: 8, marginTop: 8, justifyContent: "flex-end" }}>
                        <button onClick={() => setEditing(null)} className="at-btn at-btn-ghost">Cancel</button>
                        <button onClick={() => updateProduct(p.id, editForm)} className="at-btn at-btn-primary">Save changes</button>
                      </div>
                    </div>
                  </div>
                </div>
              </>
            );
          })()}

          {adding && (
            <>
              <div className="at-scrim" onClick={() => setAdding(false)} />
              <div className="at-modal">
                <div className="at-card at-rise" style={{ width: "100%", maxWidth: 560, padding: 24 }} onClick={e => e.stopPropagation()}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
                    <h2 className="at-disp" style={{ fontSize: 20, fontWeight: 700 }}>Add product</h2>
                    <button onClick={() => setAdding(false)} style={{ color: "var(--muted)", fontSize: 18 }}><X /></button>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

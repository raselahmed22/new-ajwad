                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                      <div>
                        <label className="at-label">Category</label>
                        <select className="at-field" value={addForm.category || CATEGORIES[0]} onChange={e => setAddForm({ ...addForm, category: e.target.value })}>
                          {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="at-label">Sizes (comma separated)</label>
                        <input className="at-field" value={addForm.sizes || ""} onChange={e => setAddForm({ ...addForm, sizes: e.target.value })} placeholder="S, M, L, XL" />
                      </div>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                      <div>
                        <label className="at-label">Price</label>
                        <input type="number" className="at-field at-mono" value={addForm.price ?? ""} onChange={e => setAddForm({ ...addForm, price: e.target.value })} />
                      </div>
                      <div>
                        <label className="at-label">Stock</label>
                        <input type="number" className="at-field at-mono" value={addForm.stock ?? ""} onChange={e => setAddForm({ ...addForm, stock: e.target.value })} />
                      </div>
                    </div>
                    <div>
                      <label className="at-label">Description</label>
                      <input className="at-field" value={addForm.description || ""} onChange={e => setAddForm({ ...addForm, description: e.target.value })} />

                    <ImagePicker value={addForm.image} onChange={img => setAddForm({ ...addForm, image: img })} idSuffix="new" />
                    <div style={{ display: "flex", gap: 8, marginTop: 8, justifyContent: "flex-end" }}>

                    </div>
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    function Orders({ orders, settings, money, notify, isSuperAdmin }) {
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [selected, setSelected] = useState([]);
      const [invoiceOrder, setInvoiceOrder] = useState(null);
      const updateStatus = async (id, status) => {
        try {
          await db.collection("orders").doc(id).update({ status });
          notify("Order updated");
        } catch (e) {
          notify("Couldn't update order: " + e.message);
        }
      };
      const toggleSelect = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
      const toggleSelectAll = () => setSelected(s => s.length === orders.length ? [] : orders.map(o => o.id));
      const deleteOrders = async (ids) => {
        try {
          const batch = db.batch();
          ids.forEach(id => batch.delete(db.collection("orders").doc(id)));
          await batch.commit();
          notify(ids.length > 1 ? `${ids.length} orders removed` : "Order removed");
        } catch (e) {
          notify("Couldn't remove: " + e.message);
        }
        setSelected(s => s.filter(id => !ids.includes(id)));
        setConfirmDelete(null);
      };

      return (
        <div style={{ maxWidth: 1440 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ width: 40, height: 40, borderRadius: 10, background: "rgba(214,167,86,.16)", color: "#D6A756", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}><Receipt /></span>
                <h1 className="at-disp" style={{ fontSize: 28, fontWeight: 700, margin: 0 }}>Orders</h1>
              </div>
              <p style={{ color: "var(--muted)", marginTop: 4, fontSize: 14 }}>{orders.length} orders</p>
            </div>
            {isSuperAdmin && selected.length > 0 && (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span className="at-mono" style={{ fontSize: 12, color: "var(--muted)" }}>{selected.length} selected</span>
                <button onClick={() => setSelected([])} className="at-btn at-btn-ghost at-btn-sm">Clear</button>
                <button onClick={() => setConfirmDelete(selected)} className="at-btn at-btn-sm" style={{ background: "var(--warn)", color: "#fff" }}>
                  <Trash2 /> Delete selected
                </button>
              </div>
            )}
          </div>

          <div className="at-card" style={{ overflowX: "auto", borderTop: "3px solid #D6A756" }}>
            <table className="at-table">
              <thead>
                <tr>
                  {isSuperAdmin && (
                    <th style={{ width: 32 }}>
                      <input type="checkbox" checked={orders.length > 0 && selected.length === orders.length} onChange={toggleSelectAll} />
                    </th>
                  )}
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Date</th>
                  <th>Payment</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th style={{ width: 120 }}></th>
                  <th style={{ width: 40 }}></th>
                  {isSuperAdmin && <th style={{ width: 40 }}></th>}
                </tr>
              </thead>
              <tbody>
                {orders.map(o => (
                  <tr key={o.id}>
                    {isSuperAdmin && (
                      <td>
                        <input type="checkbox" checked={selected.includes(o.id)} onChange={() => toggleSelect(o.id)} />
                      </td>
                    )}
                    <td className="at-mono" style={{ fontWeight: 500 }}>{o.id}</td>
                    <td>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        {o.customer.name}
                        {o.channel === "pos" && <span className="at-badge" style={{ background: "rgba(46,139,87,.14)", color: "#2E8B57" }}>In-store</span>}
                      </div>
                      <div style={{ fontSize: 12, color: "var(--muted)" }}>{o.customer.email}</div>
                    </td>
                    <td style={{ whiteSpace: "nowrap" }}>{timeAgo(o.createdAt)}</td>
                    <td className="at-mono" style={{ fontSize: 12 }}>{paymentLabel(o)}</td>
                    <td className="at-mono">{money(o.total)}</td>
                    <td>
                      <span className="at-badge" style={{ background: STATUS_META[o.status].bg, color: STATUS_META[o.status].fg }}>
                        {STATUS_META[o.status].label}
                      </span>
                    </td>
                    <td>
                      <select defaultValue={o.status} onChange={e => updateStatus(o.id, e.target.value)} className="at-field" style={{ padding: "6px 10px", width: "auto" }}>
                        <option value="pending">Pending</option>
                        <option value="paid">Paid</option>
                        <option value="shipped">Shipped</option>
                        <option value="delivered">Delivered</option>
                      </select>
                    </td>
                    <td style={{ textAlign: "right" }}>
                      <button onClick={() => setInvoiceOrder(o)} title="View invoice" style={{ color: "var(--muted)", fontSize: 16 }}><Receipt /></button>
                    </td>
                    {isSuperAdmin && (
                      <td style={{ textAlign: "right" }}>
                        <button onClick={() => setConfirmDelete([o.id])} style={{ color: "var(--muted)", fontSize: 16 }}><Trash2 /></button>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {invoiceOrder && <Invoice order={invoiceOrder} settings={settings} money={money} onClose={() => setInvoiceOrder(null)} />}

          {confirmDelete && (
            <>
              <div className="at-scrim" onClick={() => setConfirmDelete(null)} />
              <div className="at-modal">
                <div className="at-card at-rise" style={{ width: "100%", maxWidth: 420, padding: 24 }} onClick={e => e.stopPropagation()}>
                  <h2 className="at-disp" style={{ fontSize: 18, fontWeight: 700, marginBottom: 10 }}>
                    {confirmDelete.length > 1 ? `Remove ${confirmDelete.length} orders?` : "Remove this order?"}
                  </h2>
                  <p style={{ color: "var(--muted)", fontSize: 13, lineHeight: 1.6 }}>
                    {confirmDelete.length > 1
                      ? `This permanently deletes ${confirmDelete.length} selected orders. This can't be undone.`
                      : <>This permanently deletes order <b className="at-mono">{confirmDelete[0]}</b>. This can't be undone.</>}
                  </p>
                  <div style={{ display: "flex", gap: 8, marginTop: 20, justifyContent: "flex-end" }}>
                    <button onClick={() => setConfirmDelete(null)} className="at-btn at-btn-ghost">Cancel</button>
                    <button onClick={() => deleteOrders(confirmDelete)} className="at-btn at-btn-primary" style={{ background: "var(--warn)" }}>
                      {confirmDelete.length > 1 ? "Delete selected" : "Delete order"}
                    </button>
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    function Users({ staff, currentUser, notify }) {
      const [adding, setAdding] = useState(false);
      const [form, setForm] = useState({});
      const [busy, setBusy] = useState(false);
      const [editing, setEditing] = useState(null);
      const [editForm, setEditForm] = useState({});
      const [confirmDelete, setConfirmDelete] = useState(null);
      const superAdminCount = staff.filter(u => u.role === "super_admin").length;

      const addStaff = async () => {
        if (!form.name || !form.email || !form.password) return;
        setBusy(true);
        try {
          const cred = await secondaryAuth.createUserWithEmailAndPassword(form.email.trim(), form.password);
          await db.collection("staff").doc(cred.user.uid).set({ name: form.name.trim(), email: form.email.trim(), role: form.role || "admin" });
          await secondaryAuth.signOut();
          notify("Staff account created");
          setAdding(false);
          setForm({});
        } catch (e) {
          notify(e.message);
        }
        setBusy(false);
      };

      const updateStaff = (id, updates) => {
        db.collection("staff").doc(id).update(updates);
        notify("Staff updated");
        setEditing(null);
      };

      const sendReset = (email) => {
        auth.sendPasswordResetEmail(email)
          .then(() => notify("Password reset email sent to " + email))
          .catch(e => notify(e.message));
      };

      const removeStaff = (id) => {
        db.collection("staff").doc(id).delete();
        notify("Staff access revoked");
        setConfirmDelete(null);
      };

      return (
        <div style={{ maxWidth: 1200 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ width: 40, height: 40, borderRadius: 10, background: "rgba(91,192,190,.16)", color: "#5BC0BE", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}><UsersIcon /></span>
                <h1 className="at-disp" style={{ fontSize: 28, fontWeight: 700, margin: 0 }}>Users</h1>
              </div>
              <p style={{ color: "var(--muted)", marginTop: 4, fontSize: 14 }}>{staff.length} accounts · super admins can do everything, admins can't delete orders or users</p>
            </div>
            <button onClick={() => { setAdding(true); setForm({}); }} className="at-btn at-btn-primary">
              <Plus /> Add user
            </button>
          </div>

          <div className="at-card" style={{ overflowX: "auto", borderTop: "3px solid #5BC0BE" }}>
            <table className="at-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th style={{ width: 140 }}></th>
                </tr>
              </thead>
              <tbody>
                {staff.map(u => {
                  const isSelf = u.id === currentUser.id;
                  const isLastSuperAdmin = u.role === "super_admin" && superAdminCount <= 1;
                  return (
                    <tr key={u.id}>
                      <td style={{ fontWeight: 500 }}>
                        {u.name}
                        {isSelf && <span className="at-mono" style={{ fontSize: 11, color: "var(--muted)", marginLeft: 6 }}>(you)</span>}
                      </td>
                      <td className="at-mono">{u.email}</td>
                      <td>
                        <span className="at-badge" style={{ background: u.role === "super_admin" ? "rgba(91,192,190,.15)" : "var(--accent-tint)", color: u.role === "super_admin" ? "#3A9C99" : "var(--accent)" }}>
                          {u.role === "super_admin" ? "Super admin" : "Admin"}
                        </span>
                      </td>
                      <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>
                        <button onClick={() => sendReset(u.email)} title="Send password reset email" style={{ color: "var(--muted)", fontSize: 16, marginRight: 8 }}><Lock /></button>
                        <button onClick={() => { setEditing(u.id); setEditForm({}); }} style={{ color: "var(--muted)", fontSize: 16, marginRight: 8 }}><Pencil /></button>
                        {!isSelf && !isLastSuperAdmin && (
                          <button onClick={() => setConfirmDelete(u.id)} style={{ color: "var(--muted)", fontSize: 16 }}><Trash2 /></button>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {editing && (() => {
            const u = staff.find(x => x.id === editing);
            const editIsLastSuperAdmin = u.role === "super_admin" && superAdminCount <= 1;
            return (
              <>
                <div className="at-scrim" onClick={() => setEditing(null)} />
                <div className="at-modal">
                  <div className="at-card at-rise" style={{ width: "100%", maxWidth: 460, padding: 24 }} onClick={e => e.stopPropagation()}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
                      <h2 className="at-disp" style={{ fontSize: 20, fontWeight: 700 }}>Edit user</h2>
                      <button onClick={() => setEditing(null)} style={{ color: "var(--muted)", fontSize: 18 }}><X /></button>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                      <div>
                        <label className="at-label">Name</label>
                        <input className="at-field" defaultValue={u.name} onChange={e => setEditForm({ ...editForm, name: e.target.value })} />
                      </div>
                      <p className="at-mono" style={{ fontSize: 11, color: "var(--muted)" }}>Email: {u.email} · use the 🔒 icon to send a password reset email — passwords can't be changed here.</p>
                      <div>
                        <label className="at-label">Role</label>
                        <select className="at-field" defaultValue={u.role} disabled={editIsLastSuperAdmin} onChange={e => setEditForm({ ...editForm, role: e.target.value })}>
                          <option value="admin">Admin — can't delete orders/users</option>
                          <option value="super_admin">Super admin — full access</option>
                        </select>
                        {editIsLastSuperAdmin && <p className="at-mono" style={{ fontSize: 11, color: "var(--muted)", marginTop: 6 }}>This is the only super admin — add another before changing this one's role.</p>}
                      </div>
                      <div style={{ display: "flex", gap: 8, marginTop: 8, justifyContent: "flex-end" }}>
                        <button onClick={() => setEditing(null)} className="at-btn at-btn-ghost">Cancel</button>
                        <button onClick={() => updateStaff(u.id, editForm)} className="at-btn at-btn-primary">Save changes</button>
                      </div>
                    </div>
                  </div>
                </div>
              </>
            );
          })()}

          {adding && (
            <>
              <div className="at-scrim" onClick={() => setAdding(false)} />
              <div className="at-modal">
                <div className="at-card at-rise" style={{ width: "100%", maxWidth: 460, padding: 24 }} onClick={e => e.stopPropagation()}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
                    <h2 className="at-disp" style={{ fontSize: 20, fontWeight: 700 }}>Add user</h2>
                    <button onClick={() => setAdding(false)} style={{ color: "var(--muted)", fontSize: 18 }}><X /></button>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                    <div>
                      <label className="at-label">Name</label>
                      <input className="at-field" value={form.name || ""} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Fatima Rahman" />
                    </div>
                    <div>
                      <label className="at-label">Email</label>
                      <input className="at-field at-mono" type="email" value={form.email || ""} onChange={e => setForm({ ...form, email: e.target.value })} placeholder="fatima@yourdomain.com" />
                    </div>
                    <div>
                      <label className="at-label">Password</label>
                      <input className="at-field at-mono" type="text" value={form.password || ""} onChange={e => setForm({ ...form, password: e.target.value })} placeholder="At least 6 characters" />
                    </div>
                    <div>
                      <label className="at-label">Role</label>
                      <select className="at-field" value={form.role || "admin"} onChange={e => setForm({ ...form, role: e.target.value })}>
                        <option value="admin">Admin — can't delete orders/users</option>
                        <option value="super_admin">Super admin — full access</option>
                      </select>
                    </div>
                    <div style={{ display: "flex", gap: 8, marginTop: 8, justifyContent: "flex-end" }}>
                      <button onClick={() => setAdding(false)} className="at-btn at-btn-ghost">Cancel</button>
                      <button onClick={addStaff} disabled={busy || !form.name || !form.email || !form.password} className="at-btn at-btn-primary">{busy ? "Creating…" : "Add user"}</button>
                    </div>
                  </div>
                </div>
              </div>
            </>
          )}

          {confirmDelete && (
            <>
              <div className="at-scrim" onClick={() => setConfirmDelete(null)} />
              <div className="at-modal">
                <div className="at-card at-rise" style={{ width: "100%", maxWidth: 420, padding: 24 }} onClick={e => e.stopPropagation()}>
                  <h2 className="at-disp" style={{ fontSize: 18, fontWeight: 700, marginBottom: 10 }}>Remove this user?</h2>
                  <p style={{ color: "var(--muted)", fontSize: 13, lineHeight: 1.6 }}>They'll immediately lose access to the admin panel.</p>
                  <div style={{ display: "flex", gap: 8, marginTop: 20, justifyContent: "flex-end" }}>
                    <button onClick={() => setConfirmDelete(null)} className="at-btn at-btn-ghost">Cancel</button>
                    <button onClick={() => removeStaff(confirmDelete)} className="at-btn at-btn-primary" style={{ background: "var(--warn)" }}>Remove user</button>
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    function Settings({ settings, notify }) {
      const [form, setForm] = useState(settings);

      const save = async () => {
        try {
          await db.collection("settings").doc("main").set(form);
          notify("Settings saved");
        } catch (e) {
          notify("Couldn't save: " + e.message);
        }
      };

      return (
        <div style={{ maxWidth: 680 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
            <span style={{ width: 40, height: 40, borderRadius: 10, background: "rgba(199,123,156,.16)", color: "#C77B9C", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}><SettingsIcon /></span>
            <h1 className="at-disp" style={{ fontSize: 28, fontWeight: 700, margin: 0 }}>Settings</h1>
          </div>
          <div className="at-card" style={{ padding: 24, borderTop: "3px solid #C77B9C" }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div>
                <label className="at-label">Brand name</label>
                <input className="at-field" value={form.brand} onChange={e => setForm({ ...form, brand: e.target.value })} />
              </div>
              <div>
                <label className="at-label">Logo URL</label>
                <input className="at-field" value={form.logo} onChange={e => setForm({ ...form, logo: e.target.value })} placeholder="https://example.com/logo.png" />
              </div>
              <div>
                <label className="at-label">Tagline</label>
                <input className="at-field" value={form.tagline} onChange={e => setForm({ ...form, tagline: e.target.value })} />
              </div>
              <div>
                <ImagePicker
                  label="Homepage banner"
                  idSuffix="banner"
                  maxDim={1600}
                  value={form.bannerImage}
                  onChange={v => setForm({ ...form, bannerImage: v })}
                  preview={v => <img src={v} alt="Banner preview" style={{ width: "100%", maxWidth: 420, height: 130, objectFit: "cover", borderRadius: 4 }} />}
                />
                <p className="at-mono" style={{ fontSize: 11, color: "var(--muted)", marginTop: 6 }}>Shows at the top of your storefront home page, above the products.</p>
              </div>
              <div>
                <label className="at-label">Currency symbol</label>
                <input className="at-field at-mono" value={form.symbol} onChange={e => setForm({ ...form, symbol: e.target.value })} style={{ maxWidth: 160 }} />
              </div>
              <p className="at-mono" style={{ fontSize: 11, color: "var(--muted)" }}>Admin logins are now managed under the <b>Users</b> tab (super admin only).</p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                <div>
                  <label className="at-label">Shipping — inside Dhaka</label>
                  <input type="number" className="at-field at-mono" value={form.shipInsideDhaka} onChange={e => setForm({ ...form, shipInsideDhaka: Number(e.target.value) })} />
                </div>
                <div>
                  <label className="at-label">Shipping — outside Dhaka</label>
                  <input type="number" className="at-field at-mono" value={form.shipOutsideDhaka} onChange={e => setForm({ ...form, shipOutsideDhaka: Number(e.target.value) })} />
                </div>
              </div>
              <div>
                <label className="at-label">Admin panel link</label>
                <input className="at-field at-mono" value={form.adminUrl} onChange={e => setForm({ ...form, adminUrl: e.target.value })} placeholder="https://admin.yourdomain.com" />
              </div>
              <div>
                <label className="at-label">Address</label>
                <input className="at-field" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} placeholder="Dhaka, Bangladesh" />
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                <div>
                  <label className="at-label">Mobile number</label>
                  <input className="at-field at-mono" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} placeholder="01333707715" />
                </div>
                <div>
                  <label className="at-label">WhatsApp number</label>
                  <input className="at-field at-mono" value={form.whatsapp} onChange={e => setForm({ ...form, whatsapp: e.target.value })} placeholder="01333707715" />
                </div>
              </div>
              <div>
                <label className="at-label">Facebook page link</label>
                <input className="at-field" value={form.facebook} onChange={e => setForm({ ...form, facebook: e.target.value })} placeholder="https://www.facebook.com/yourpage" />
              </div>
              <div style={{ borderTop: "1px solid var(--line)", paddingTop: 16, marginTop: 4 }}>
                <div className="at-eyebrow" style={{ marginBottom: 12 }}>Manual bKash / Nagad payment</div>
                <p className="at-mono" style={{ fontSize: 11, color: "var(--muted)", marginBottom: 14 }}>
                  These numbers are shown to customers at checkout and in POS. Customers send money themselves, then enter the Transaction ID — you verify it manually in the Orders tab before marking an order Paid.
                </p>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                  <div>
                    <label className="at-label">bKash number (Send Money)</label>
                    <input className="at-field at-mono" value={form.bkashNumber} onChange={e => setForm({ ...form, bkashNumber: e.target.value })} placeholder="01333707715" />
                  </div>
                  <div>
                    <label className="at-label">Nagad number (Send Money)</label>
                    <input className="at-field at-mono" value={form.nagadNumber} onChange={e => setForm({ ...form, nagadNumber: e.target.value })} placeholder="01333707715" />
                  </div>
                </div>
              </div>
              <div style={{ marginTop: 8 }}>
                <button onClick={save} className="at-btn at-btn-primary">Save settings</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
